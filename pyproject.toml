[project]
name = "learn-mcp-with-python"
version = "0.1.0"
description = "Learn Model Context Protocol with Python のサンプルコード"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # mcp 2.x では FastMCP が MCPServer に名前が変わり、このリポジトリで使っている API
    # （RequestContext、streamablehttp_client など）がいくつか削除された。1.13.1 は、ここで使う
    # すべての API（Streamable HTTP、elicitation）があることを確認した最も古いバージョン。
    "mcp[cli]>=1.13.1,<2",
    # mcp の間接的な依存だが、サンプルが直接 import しているので明示的に宣言する
    "anyio",
    "click",
    # Chapter10 の EmailStr のために [email] を付ける
    "pydantic[email]",
    "pydantic-settings",
    "starlette",
    "uvicorn",
    # Chapter05 / Chapter11 / Chapter12 の HTTP サンプル
    "flask",
    "requests",
    # Chapter11 の認証サンプル
    "pyjwt",
    "python-dotenv",
    # Chapter07 / Chapter09 の LLM クライアント（OpenAI 互換 API 経由で Amazon Bedrock を使う）
    "openai",
    "aws-bedrock-token-generator",
    # Chapter13 の Web サンプル
    "fastapi[standard]",
]

[dependency-groups]
# 型チェックと docstring の書式チェック用
dev = [
    "mypy",
    "ruff",
]

[tool.uv]
# 独立したサンプルスクリプトの集まりであり、インストール可能なパッケージではない
package = false

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.ruff.lint]
select = ["D"]
# D400 / D415 は要約の末尾を英語のピリオドにする規則。docstring は日本語で「。」で終わるので除外する
ignore = ["D400", "D415"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
